[platformio]
description = LibrePulse BLE Bike
src_dir = src
default_envs = ble-bike

[env:ble-bike]
platform = espressif32
board = esp32dev
framework = arduino

; --- Serial ports ---
; If you see both tty.* and cu.* on macOS, prefer tty.*
upload_port = /dev/tty.usbserial-10
monitor_port = /dev/tty.usbserial-10

; --- Speeds ---
monitor_speed = 115200
upload_speed = 115200

; --- Make uploads resilient on noisy links ---
; Do not add --no-stub: the ROM loader path erases the NVS partition on every
; upload, wiping the stored brake calibration and flywheel settings.
upload_flags =
  --before=default_reset
  --after=hard_reset

; Optional: timestamped monitor output
monitor_filters = time, default

; Your libs
lib_deps =
  BLE

; Host-side unit tests for the physics in lib/PowerModel: `pio test -e native`
[env:native]
platform = native
build_flags = -std=c++17
test_build_src = no
